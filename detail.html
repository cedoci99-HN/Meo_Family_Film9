<!DOCTYPE html>
<html>
<head>
    <title>Xem phim</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial;
        }

        h2 {
            padding: 10px;
        }

        .player {
            width: 100%;
            height: 60vh;
        }

        video {
            width: 100%;
            height: 100%;
            background: black;
        }

        @media (orientation: landscape) {
            .player {
                height: 100vh;
            }
        }

        #episodes {
            padding: 10px;
        }

        button {
            margin: 5px;
            padding: 8px 12px;
        }
    </style>
</head>

<body>

<h2 id="title">Loading...</h2>

<div class="player" id="player"></div>

<div id="episodes"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

async function init() {

    const slug = new URLSearchParams(window.location.search).get("slug");

    if (!slug) return;

    try {
        // 🔥 dùng OPhim (ổn định hơn)
        const res = await fetch(`https://ophim1.com/phim/${slug}`);
        const data = await res.json();

        console.log("OPHIM:", data);

        const movie = data.movie;

        document.getElementById("title").innerText = movie.name;

        const episodes = data.episodes[0].server_data;

        renderEpisodes(episodes);

        playVideo(episodes[0].link_m3u8);

    } catch (err) {
        document.getElementById("title").innerText = "❌ Không load được phim";
    }
}

function renderEpisodes(list) {

    let html = "";

    list.forEach(ep => {
        html += `
            <button onclick="playVideo('${ep.link_m3u8}')">
                ${ep.name}
            </button>
        `;
    });

    document.getElementById("episodes").innerHTML = html;
}

function playVideo(link) {

    const player = document.getElementById("player");

    player.innerHTML = `<video id="video" controls autoplay></video>`;

    const video = document.getElementById("video");

    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(link);
        hls.attachMedia(video);
    } else {
        video.src = link;
    }
}

init();

</script>

</body>
</html>
