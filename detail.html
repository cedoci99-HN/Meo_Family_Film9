<!DOCTYPE html>
<html>
<head>
    <title>Xem phim</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body { margin:0; background:black; color:white; }

        video {
            width:100%;
            height:100vh;
            object-fit:contain;
        }
    </style>
</head>

<body>

<h3 id="title"></h3>
<video id="video" controls autoplay></video>

<script>

async function init() {

    const name = new URLSearchParams(location.search).get("name");
    document.getElementById("title").innerText = name;

    const res = await fetch(`https://ophim1.com/v1/api/tim-kiem?keyword=${name}`);
    const data = await res.json();

    const slug = data.data.items[0]?.slug;

    if (!slug) {
        document.body.innerHTML = "❌ Không tìm thấy phim";
        return;
    }

    const res2 = await fetch(`https://ophim1.com/phim/${slug}`);
    const detail = await res2.json();

    const link = detail.episodes[0].server_data[0].link_m3u8;

    play(link);
}

function play(src) {
    const video = document.getElementById("video");

    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(src);
        hls.attachMedia(video);
    } else {
        video.src = src;
    }
}

init();

</script>

</body>
</html>
