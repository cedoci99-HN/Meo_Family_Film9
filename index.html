<!DOCTYPE html>
<html>
<head>
    <title>🎬 Netflix VN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body { margin:0; background:#111; color:white; font-family:Arial; }

        header {
            padding:10px;
            text-align:center;
            font-size:22px;
            font-weight:bold;
            background:black;
        }

        .search-box {
            text-align:center;
            margin:10px;
        }

        input {
            padding:10px;
            width:80%;
            border-radius:20px;
            border:none;
        }

        .banner {
            height:200px;
            background:url('banner.jpg') center/cover;
            display:flex;
            align-items:end;
            padding:20px;
        }

        .banner h2 {
            background:rgba(0,0,0,0.6);
            padding:10px;
        }

        .row {
            margin:10px;
        }

        .row h3 {
            margin:5px;
        }

        .list {
            display:flex;
            overflow-x:auto;
            gap:10px;
        }

        .movie {
            min-width:120px;
            cursor:pointer;
        }

        .movie img {
            width:100%;
            border-radius:8px;
        }

    </style>
</head>

<body>

<header>🎬 Netflix của Nam Khánh (Mèo)</header>

<div class="search-box">
    <input id="search" placeholder="Tìm phim..." oninput="searchMovie()">
</div>

<div class="banner">
    <h2>🎉 Chúc mọi người xem phim vui vẻ 🎉</h2>
</div>

<div id="content"></div>

<script>

const TMDB_KEY = "503177f68c7fd46fdbf4d769a60ae5a1";

// LOAD CATEGORY
async function loadHome() {

    const urls = [
        {title:"🔥 Trending", url:`https://api.themoviedb.org/3/trending/movie/day?api_key=${TMDB_KEY}&language=vi-VN`},
        {title:"🎬 Hành động", url:`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_genres=28`},
        {title:"❤️ Tình cảm", url:`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_genres=10749`}
    ];

    let html = "";

    for (let u of urls) {

        const res = await fetch(u.url);
        const data = await res.json();

        html += `<div class="row"><h3>${u.title}</h3><div class="list">`;

        data.results.forEach(m => {

            const img = m.poster_path
                ? "https://image.tmdb.org/t/p/w300" + m.poster_path
                : "";

            html += `
                <div class="movie" onclick="goDetail('${m.title}')">
                    <img src="${img}">
                </div>
            `;
        });

        html += `</div></div>`;
    }

    document.getElementById("content").innerHTML = html;
}

// SEARCH MIX
async function searchMovie() {

    const q = document.getElementById("search").value;

    if (q.length < 2) {
        loadHome();
        return;
    }

    const res1 = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${q}&language=vi-VN`);
    const res2 = await fetch(`https://ophim1.com/v1/api/tim-kiem?keyword=${q}`);

    const tmdb = await res1.json();
    const ophim = await res2.json();

    let html = "<div class='row'><h3>🔍 Kết quả</h3><div class='list'>";

    tmdb.results.forEach(m => {
        const img = "https://image.tmdb.org/t/p/w300" + m.poster_path;

        html += `
            <div class="movie" onclick="goDetail('${m.title}')">
                <img src="${img}">
            </div>
        `;
    });

    (ophim.data.items || []).forEach(m => {
        const img = m.thumb_url.startsWith("http")
            ? m.thumb_url
            : "https://ophim1.com" + m.thumb_url;

        html += `
            <div class="movie" onclick="goDetail('${m.name}')">
                <img src="${img}">
            </div>
        `;
    });

    html += "</div></div>";

    document.getElementById("content").innerHTML = html;
}

function goDetail(name) {
    window.location.href = "detail.html?name=" + encodeURIComponent(name);
}

loadHome();

</script>

</body>
</html>
