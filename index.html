<!DOCTYPE html>
<html>
<head>
    <title>🎬 Web Xem Phim</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #111;
            color: white;
        }

        h1 {
            text-align: center;
            padding: 10px;
        }

        /* SEARCH */
        .search-box {
            text-align: center;
            margin: 10px;
        }

        input {
            padding: 10px;
            width: 70%;
            border-radius: 20px;
            border: none;
        }

        /* BANNER */
        .banner {
            text-align: center;
            margin: 20px 0;
        }

        .banner img {
            width: 250px;
            border-radius: 15px;
        }

        .rainbow {
            font-size: 18px;
            font-weight: bold;
            animation: colorChange 3s infinite;
        }

        @keyframes colorChange {
            0% { color: red; }
            20% { color: orange; }
            40% { color: yellow; }
            60% { color: green; }
            80% { color: blue; }
            100% { color: violet; }
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            padding: 10px;
        }

        .movie {
            cursor: pointer;
            transition: 0.3s;
        }

        .movie:hover {
            transform: scale(1.05);
        }

        .movie img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .movie p {
            font-size: 14px;
            margin: 5px 0;
        }

        /* PAGINATION */
        .pagination {
            text-align: center;
            margin: 20px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: white;
        }

        button:hover {
            background: red;
        }
    </style>
</head>

<body>

<h1>🎬 Web Xem Phim của Mèo</h1>

<!-- SEARCH -->
<div class="search-box">
    <input type="text" id="searchInput" placeholder="Tìm phim..." oninput="searchMovie()">
</div>

<!-- BANNER -->
<div class="banner">
    <img src="banner.jpg">
    <p class="rainbow">🎉 chúc mọi người xem phim vui vẻ 🎉</p>
</div>

<!-- LIST -->
<div id="movieList" class="grid"></div>

<!-- PAGINATION -->
<div class="pagination">
    <button onclick="prevPage()">⬅ Prev</button>
    <span id="pageInfo">Page 1</span>
    <button onclick="nextPage()">Next ➡</button>
</div>

<script>

let currentPage = 1;
let isSearch = false;

// LOAD PHIM (OPHIM)
async function loadMovies(page = 1) {

    isSearch = false;
    currentPage = page;

    document.getElementById("movieList").innerHTML = "Đang tải...";

    try {
        const res = await fetch(`https://ophim1.com/v1/api/danh-sach/phim-moi-cap-nhat?page=${page}`);
        const data = await res.json();

        const list = data?.data?.items || [];

        renderMovies(list);
        updatePage();

    } catch {
        document.getElementById("movieList").innerHTML = "❌ Lỗi load phim";
    }
}

// SEARCH TOÀN SITE
async function searchMovie() {

    const keyword = document.getElementById("searchInput").value.trim();

    if (keyword.length < 2) {
        loadMovies(1);
        return;
    }

    isSearch = true;

    document.getElementById("movieList").innerHTML = "🔍 Đang tìm...";

    try {
        const res = await fetch(`https://ophim1.com/v1/api/tim-kiem?keyword=${keyword}`);
        const data = await res.json();

        const list = data?.data?.items || [];

        renderMovies(list);
        updatePage();

    } catch {
        document.getElementById("movieList").innerHTML = "❌ Lỗi search";
    }
}

// PAGINATION
function nextPage() {
    if (!isSearch) loadMovies(currentPage + 1);
}

function prevPage() {
    if (currentPage > 1 && !isSearch) {
        loadMovies(currentPage - 1);
    }
}

function updatePage() {
    document.getElementById("pageInfo").innerText =
        isSearch ? "Search" : "Page " + currentPage;
}

// RENDER (FIX ẢNH CHUẨN)
function renderMovies(list) {

    if (!list.length) {
        document.getElementById("movieList").innerHTML = "Không có phim";
        return;
    }

    let html = "";

    list.forEach(m => {

        let img = "";

        if (m.thumb_url) {
            img = m.thumb_url.startsWith("http")
                ? m.thumb_url
                : "https://ophim1.com" + m.thumb_url;
        } else {
            img = "https://via.placeholder.com/300x450";
        }

        html += `
            <div class="movie" onclick="goDetail('${m.slug}')">
                <img src="${img}">
                <p>${m.name}</p>
            </div>
        `;
    });

    document.getElementById("movieList").innerHTML = html;
}

// DETAIL
function goDetail(slug) {
    window.location.href = "detail.html?slug=" + slug;
}

// LOAD BAN ĐẦU
loadMovies(1);

</script>

</body>
</html>
